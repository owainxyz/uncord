[package]
name = "uncord-fast"
version = "1.0.0"
edition = "2021"
publish = false

[lib]
name = "_fast"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py310"] }
fancy-regex = "0.14"
regex = "1"
memchr = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
